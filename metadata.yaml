name: astrbot_plugin_video_compress # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: 视频自动压缩器 # 用于展示的名字，可以是方便人类阅读的名字（需要版本 >= v4.5.0，低版本不会报错，请放心填写）
desc: 一键压缩群友的超级大视频，转换成合适的大小；支持 OneBot 与 QQ 官方机器人 # 插件简短描述
version: v2.1.0 # 插件版本号。格式：v1.1.1 或者 v1.1
author: BUGJI # 作者
repo: https://github.com/BUGJI/astrbot_plugin_video_compress # 插件的仓库地址
help: |
  视频压缩：发送或回复视频后使用 /压缩视频，默认参数可通过 /压缩视频 默认 保存。
  /压缩视频 帮助 查看完整用法；/压缩视频 状态 查看平台能力与当前个人默认。
  支持简易预设（720p30、480p30、25MB 等）和高级参数（CRF、帧率、分辨率、音频码率）。
  QQ 官方机器人不支持贴表情；视频超过约 30MB 时会按配置重新压缩或转为文件发送。
